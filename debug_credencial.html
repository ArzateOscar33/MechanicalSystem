<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Credencial</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
        }
        .credencial {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
        }
        .izquierda {
            width: 50%;
            background-color: #e7e7f9;
            padding: 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .derecha {
            width: 50%;
            background-color: #1e1e5a;
            color: white;
            padding: 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .logo {
            width: 60%;
            margin: 0 auto 5px;
        }
        .foto {
            width: 50px;
            height: 50px;
            border-radius: 5px;
            object-fit: cover;
            margin: 0 auto 5px;
            background-color: #ccc;
        }
        .info {
            font-size: 7px;
        }
        .info p {
            margin: 1px 0;
        }
        .info span {
            font-weight: bold;
            display: inline-block;
            width: 60px;
        }
        .qr img {
            width: 60px;
            height: 60px;
            margin: 0 auto;
            display: block;
        }
        .direccion {
            font-size: 6px;
            line-height: 1.2;
            text-align: justify;
        }
        .titulo {
            text-align: center;
            font-size: 8px;
            font-weight: bold;
        }
        .footer {
            font-size: 6px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="credencial">
        <!-- LADO IZQUIERDO -->
        <div class="izquierda">
            <div>
                <img src="http://localhost/MechanicalSystem/assets/images/logo.png" class="logo" alt="Logo">
                <img src="http://localhost/MechanicalSystem/assets/empleados/fotografia/empleado_6824cfcc60948.jpg" class="foto" alt="Foto">
            </div>
            <div class="info">
                <p><span>Nombre:</span>Oscar Arzate Arzate Martinez</p>
                <p><span>Puesto:</span>Técnico de Soporte</p>
                <p><span>No. Empleado:</span>20250514001</p>
                <p><span>Departamento:</span>Soporte Técnico</p>
            </div>
            <div class="footer">
                Fecha de Emisión: 14/05/2025            </div>
        </div>

        <!-- LADO DERECHO -->
        <div class="derecha">
            <div class="titulo">DIVISIÓN MÉXICO</div>
            <div class="qr">
                <img src="http://localhost/MechanicalSystem/assets/empleados/credencial/qr_20250514001.png" alt="Código QR">
            </div>
            <div class="direccion">
                Dirección: Cayetano Perez 240-I, Buena Vista,<br>
                Burocrata Ruiz Cortinez, 22406<br>
                Tijuana, B.C.<br><br>
                RFC: AAMO990217154            </div>
        </div>
    </div>
</body>
</html>
